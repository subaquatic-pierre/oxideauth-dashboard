name: Build and Verify Dashboard Container

on:
  push:
    tags: ["*.*.*"]
  workflow_dispatch:

concurrency:
  group: dashboard-container-build
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/dashboard

jobs:
  build-container:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=,format=short

      - name: Build container image (load to Docker, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify container starts
        run: |
          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}"
          docker run -d --name dashboard-test -p 3000:3000 "${IMAGE_TAG}"
          echo "Waiting for container to start..."
          for i in $(seq 1 15); do
            STATUS=$(curl -sS -o /dev/null -w "%{http_code}" http://localhost:3000 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "SUCCESS: Container responded HTTP 200"
              break
            fi
            echo "Attempt ${i}/15: HTTP ${STATUS} — waiting..."
            sleep 2
          done
          docker stop dashboard-test
          docker rm dashboard-test

      - name: Kubernetes deployment (pending)
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << 'EOF'

          ---

          ## :whale: Container Deployment Status

          | Stage                | Status    |
          |----------------------|-----------|
          | Container build      | Success   |
          | Container verify     | Success   |
          | Registry push        | Skipped   |
          | Kubernetes deploy    | **PENDING** |

          **Next steps**: When Kubernetes cluster is provisioned:
          1. Uncomment `docker/login-action` step in this workflow
          2. Change `load: true` to `push: true` in `docker/build-push-action`
          3. Add a deployment job with `kubectl set image` or a Helm upgrade step

          The container image is built and verified but not persisted beyond this CI run.

          EOF
